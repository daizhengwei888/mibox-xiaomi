<!doctype html>
<html lang="zh-CN" data-mb-skin="xiaomi-orange">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>谜盒·划词笔记</title>
  <link rel="stylesheet" href="src/shared/theme.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="pop-header">
    <div class="pop-brand">
      <img src="icons/48.png" alt="谜盒" class="pop-logo" />
      <div>
        <div class="pop-title-row">
          <h1 class="pop-title">谜盒·划词笔记</h1>
          <span class="mb-pill" id="vp-indicator">compact</span>
        </div>
        <p class="pop-sub" id="current-page-domain">划词笔记 · 护眼阅读</p>
      </div>
    </div>
    <div class="pop-head-actions">
      <button type="button" class="mb-touch-btn soft pop-icon-btn" id="btn-cycle-skin" title="切换主题色">主题</button>
      <button type="button" class="mb-touch-btn soft pop-icon-btn" id="btn-open-drawer" title="打开侧边栏">侧栏</button>
      <button type="button" class="mb-touch-btn primary pop-icon-btn" id="btn-open-app" title="打开完整页面">⊞</button>
    </div>
  </header>

  <nav class="pop-tabs" role="tablist">
    <button type="button" class="pop-tab active" data-tab="page">本页</button>
    <button type="button" class="pop-tab" data-tab="ai">要点</button>
    <button type="button" class="pop-tab" data-tab="quick">搜索 · 速记</button>
  </nav>

  <main class="pop-main">
    <!-- Tab 1: 当前页收藏、全局护眼阅读、可见页截图、DNR净网 -->
    <section class="pop-panel active" id="tab-page">
      <div class="mb-card pop-page-card">
        <div class="pop-page-title" id="page-title-display">正在读取当前标签页…</div>
        <div class="pop-page-meta" id="page-meta-display">支持一键智能提炼简介、分类与阅读时长</div>
        <div class="pop-action-grid">
          <button type="button" class="mb-touch-btn primary" id="btn-collect-page">收藏本页</button>
          <button type="button" class="mb-touch-btn" id="btn-capture-page">截图入笔记</button>
        </div>
      </div>

      <div class="mb-card">
        <div class="pop-sec-head">
          <span class="pop-sec-title">阅读模式</span>
          <span class="mb-pill" id="reading-sync-status">所有标签页同步</span>
        </div>
        <div class="pop-mode-grid" id="reading-mode-buttons">
          <button type="button" class="mb-touch-btn" data-mode="off">原生</button>
          <button type="button" class="mb-touch-btn" data-mode="warm">暖纸护眼</button>
          <button type="button" class="mb-touch-btn" data-mode="dark">深色夜读</button>
          <button type="button" class="mb-touch-btn" data-mode="eink">墨水屏</button>
        </div>
        <div class="pop-scale-row">
          <span>字号</span>
          <div class="pop-scale-btns" id="font-scale-buttons">
            <button type="button" class="mb-touch-btn" data-scale="100">标准</button>
            <button type="button" class="mb-touch-btn" data-scale="115">大</button>
            <button type="button" class="mb-touch-btn" data-scale="130">特大</button>
          </div>
        </div>
      </div>

      <div class="mb-card pop-dnr-row">
        <div>
          <div class="pop-sec-title">屏蔽广告图片</div>
          <div class="pop-sub">切换后刷新页面生效</div>
        </div>
        <button type="button" class="mb-touch-btn" id="btn-toggle-dnr">未开启</button>
      </div>
    </section>

    <!-- Tab 2: 本页要点 -->
    <section class="pop-panel" id="tab-ai">
      <div class="mb-card">
        <div class="pop-sec-head">
          <span class="pop-sec-title">本页要点</span>
          <span class="mb-pill" id="ai-engine-badge">本地模式</span>
        </div>
        <div class="pop-action-grid">
          <button type="button" class="mb-touch-btn primary" id="btn-ai-summary">提取要点</button>
          <button type="button" class="mb-touch-btn" id="btn-ai-save-note">存为笔记</button>
        </div>
        <div class="pop-ai-output" id="ai-output-box">点「提取要点」，列出这一页的三条要点。不配置 Key 也能用；配置后由大模型生成。</div>
      </div>
    </section>

    <!-- Tab 3: 全库检索直答 & 随手闪念笔记 -->
    <section class="pop-panel" id="tab-quick">
      <div class="mb-card">
        <div class="pop-sec-title" style="margin-bottom:8px;">搜索收藏和笔记</div>
        <div class="pop-search-bar">
          <input type="search" class="mb-input" id="quick-search-input" placeholder="关键词，或 ? 开头提问" />
          <button type="button" class="mb-touch-btn primary" id="btn-quick-search">搜索</button>
        </div>
        <div class="pop-search-results" id="quick-search-results"></div>
      </div>

      <div class="mb-card">
        <div class="pop-sec-title" style="margin-bottom:8px;">随手记一条</div>
        <textarea class="mb-textarea" id="quick-note-text" placeholder="会自动带上当前网页链接"></textarea>
        <button type="button" class="mb-touch-btn primary" id="btn-save-quick-note" style="width:100%;margin-top:8px;">保存</button>
      </div>
    </section>
  </main>

  <footer class="pop-footer">
    <span id="pop-status-bar">已就绪 · 收藏 <b id="stat-bm-count">0</b> · 笔记 <b id="stat-note-count">0</b></span>
    <button type="button" class="pop-link-btn" id="btn-footer-workspace">打开完整页面 →</button>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
